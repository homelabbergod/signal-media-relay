name: Release

# Push a tag like v0.9.1 -> tests, version check, image to Docker Hub (version + latest), GitHub release.
# Needs the repository secret DOCKERHUB_TOKEN (a Docker Hub *access token*, not the password).
# Without it, the image push is skipped with a warning and the GitHub release is still created.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: homelabbergod/signal-media-relay

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Tag matches the version everywhere
        run: python scripts/check_version.py "${GITHUB_REF_NAME}"
      - run: python tests/smoketest.py
      - run: python tests/test_requests.py

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version without the leading "v" (Docker tags are 0.9.1, not v0.9.1)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Check for Docker Hub token
        id: token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning::DOCKERHUB_TOKEN is not set – skipping the Docker Hub push"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.token.outputs.present == 'true'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.token.outputs.present == 'true'
        with:
          username: homelabbergod
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.token.outputs.present == 'true'
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          provenance: true
          sbom: true
          build-args: VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest

  github-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the GitHub release from the CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          printf '\n### Docker\n```\ndocker pull %s:%s\n```\n' "$IMAGE" "$version" >> notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$version" --notes-file notes.md --latest
