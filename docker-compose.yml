services:
  signal-api:
    # Pinned version instead of :latest – apply updates deliberately (raise the tag, docker compose pull).
    image: bbernhard/signal-cli-rest-api:0.101
    container_name: signal-api
    restart: unless-stopped
    environment:
      MODE: "json-rpc"            # required for !request (receiving via WebSocket)
    volumes:
      # Contains the private keys of the Signal account – protect and back up this folder!
      - ./signal-cli-config:/home/.local/share/signal-cli
    ports:
      # The API has NO authentication: only publish locally (for the QR code / group ID).
      # After setup, remove this block completely.
      - "127.0.0.1:8080:8080"
    networks:
      - signal-net               # private: only the relay can reach the unauthenticated API
    pids_limit: 512              # measured ~160 threads (Java)
    mem_limit: 1g                # measured ~400 MB
    # Note: NO "no-new-privileges" – the image starts via s6-overlay (setuid) and
    # aborts at startup with it (tested with 0.101).

  relay:
    build: .
    image: signal-media-relay:local
    container_name: signal-media-relay
    restart: unless-stopped
    depends_on:
      - signal-api
    # Changes here only take effect after "docker compose up -d" (not "restart").
    # Don't commit your own values:  git update-index --skip-worktree docker-compose.yml
    environment:
      # --- Signal -----------------------------------------------------------
      SIGNAL_API_URL: "http://signal-api:8080"
      SIGNAL_NUMBER: "+4900000000000"              # number of the bot account
      SIGNAL_RECIPIENT: "group.REPLACE_ME"        # group ID (see README) or phone number
      BOT_LANGUAGE: "en"                          # language of the bot messages: en, de

      # --- Webhooks ---------------------------------------------------------
      # Secret token, at least 16 characters – the relay refuses to start with the placeholder.
      # Generate: python -c "import secrets;print(secrets.token_urlsafe(24))"
      RELAY_TOKEN: "change-me"
      ALLOW_INSECURE_NO_TOKEN: "false"            # testing only: accept webhooks without a token
      LISTEN_PORT: "8090"

      # --- Announcements ----------------------------------------------------
      AGGREGATE_SECONDS: "60"                     # quiet time: post after N s without a new episode
      ANNOUNCE_WAIT_FOR_QUEUE: "true"             # wait until Sonarr/Radarr finished this show/movie
      ANNOUNCE_MAX_WAIT_SECONDS: "21600"          # ... but announce after 6 h at the latest
      DEDUPE_HOURS: "24"                          # don't post the same item twice (0 = off)
      MAX_EPISODES_LISTED: "10"
      OVERVIEW_MAX_CHARS: "350"
      ANNOUNCE_UPGRADES: "false"                  # also announce quality upgrades
      ANNOUNCE_TESTS: "false"                     # post the "Test" button events into the group
      SEND_POSTERS: "true"
      POSTER_ALLOWED_HOSTS: "artworks.thetvdb.com,image.tmdb.org,assets.fanart.tv"
      LOG_LEVEL: "INFO"

      # --- Jellyfin (optional) ----------------------------------------------
      JELLYFIN_URL: ""                            # e.g. http://jellyfin:8096 – for posters/descriptions
      JELLYFIN_API_KEY: ""

      # --- !request (optional) ----------------------------------------------
      REQUESTS_ENABLED: "false"
      RADARR_URL: ""                              # e.g. http://radarr:7878
      RADARR_API_KEY: ""                          # Radarr: Settings -> General -> Security
      RADARR_QUALITY_PROFILE: ""                  # name or ID, empty = first profile
      RADARR_ROOT_FOLDER: ""                      # empty = first root folder
      RADARR_MINIMUM_AVAILABILITY: "released"     # announced, inCinemas, released
      SONARR_URL: ""                              # e.g. http://sonarr:8989
      SONARR_API_KEY: ""
      SONARR_QUALITY_PROFILE: ""
      SONARR_ROOT_FOLDER: ""
      SONARR_MONITOR: "all"                       # fallback: all, future, missing, firstSeason, lastSeason, pilot
      REQUEST_LIMIT_PER_DAY: "5"                  # titles per person and 24 h (0 = unlimited)
      REQUEST_VIA_DM: "true"                      # accept direct messages from group members
      REQUEST_ALLOWED_SENDERS: ""                 # comma-separated, empty = all group members
      REQUEST_ADMINS: ""                          # may grab rejected releases, no limit
      REQUEST_COMMANDS_PER_MINUTE: "6"            # spam brake
      RELEASES_SHOWN: "8"
      RELEASE_SEARCH_TIMEOUT: "180"
    ports:
      # If Sonarr/Radarr/Jellyfin run in the same Docker network, the port block can be removed
      # (webhook URL then http://signal-media-relay:8090/...). Otherwise bind to a LAN IP if needed,
      # e.g. "192.168.1.10:8090:8090". Never expose it unprotected to the internet.
      - "8090:8090"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    stop_grace_period: 30s
    networks:
      - signal-net

# signal-api has no authentication and holds the Signal account's keys. Keep it on a private
# network that only the relay joins – never put it on a shared network (e.g. gluetun's).
networks:
  signal-net:
    name: signal-net
